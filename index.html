<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustTaxi Boka</title>
  <style>
    body {
      background-color: black;
      color: #FFD700;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .booking-container {
      background-color: #000;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: none;
    }
    button {
      width: 100%;
      background-color: #FFD700;
      color: black;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #price-output {
      font-weight: bold;
      color: white;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="booking-container">
    <h2>Boka Flygtaxi</h2>
    <form id="bookingForm">
      <div class="form-group">
        <label>Från ort</label>
        <input type="text" id="from" required />
      </div>
      <div class="form-group">
        <label>Till flygplats</label>
        <select id="airport" required>
          <option value="">Välj</option>
          <option value="Kastrup">Kastrup</option>
          <option value="Sturup">Sturup</option>
        </select>
      </div>
      <div class="form-group">
        <label>Antal personer</label>
        <select id="passengers" required>
          <option value="">Välj</option>
          <option value="1–4">1–4</option>
          <option value="5–6">5–6</option>
          <option value="7–8">7–8</option>
        </select>
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="date" required />
      </div>
      <div class="form-group">
        <label>Tid</label>
        <input type="time" id="time" required />
      </div>
      <div class="form-group">
        <label>Namn</label>
        <input type="text" id="name" required />
      </div>
      <div class="form-group">
        <label>Telefonnummer</label>
        <input type="tel" id="phone" required />
      </div>

      <div id="price-output">Pris visas här...</div>
      <button type="submit">Skicka bokning</button>
    </form>
  </div>

  <script>
    const priceOutput = document.getElementById("price-output");
    const form = document.getElementById("bookingForm");

    const priceList = {
      "Kastrup": {
        "malmö": { "1–4": 899, "5–6": 1199, "7–8": 1299 },
        "lund": { "1–4": 999, "5–6": 1299, "7–8": 1399 }
      },
      "Sturup": {
        "malmö": { "1–4": 799, "5–6": 1099, "7–8": 1199 },
        "lund": { "1–4": 899, "5–6": 1199, "7–8": 1299 }
      }
    };

    function normalize(str) {
      return str.trim().toLowerCase();
    }

    form.addEventListener("input", () => {
      const from = normalize(document.getElementById("from").value);
      const airport = document.getElementById("airport").value;
      const passengers = document.getElementById("passengers").value;

      const price = priceList[airport]?.[from]?.[passengers];
      if (price) {
        priceOutput.textContent = `Pris: ${price} kr`;
      } else {
        priceOutput.textContent = "Pris visas här...";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        Telefonnummer: formatPhone(document.getElementById("phone").value),
        Namn: document.getElementById("name").value,
        Flygplats: document.getElementById("airport").value,
        Datum: document.getElementById("date").value,
        Tid: document.getElementById("time").value
      };

      try {
        const response = await fetch("https://taxi-sms.onrender.com/send-sms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          alert("Bokning mottagen!");
          form.reset();
        } else {
          alert("Fel vid bokning.");
        }
      } catch (err) {
        alert("Något gick fel: " + err.message);
      }
    });

    function formatPhone(num) {
      num = num.trim();
      if (num.startsWith("+")) return num;
      if (num.startsWith("0")) return "+46" + num.slice(1);
      return "+46" + num;
    }
  </script>
</body>
</html>
